name: Build AirSync (Self-Compiled)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit from sameerasw/airsync-mac"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out AirSync source
        uses: actions/checkout@v4
        with:
          repository: sameerasw/airsync-mac
          ref: ${{ inputs.ref }}
          path: airsync-mac

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build archive with self-compiled scheme
        working-directory: airsync-mac
        run: |
          xcodebuild archive \
            -scheme "AirSync Self Compiled" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/AirSync.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Collect app bundle
        run: |
          mkdir -p output
          cp -R "$RUNNER_TEMP/AirSync.xcarchive/Products/Applications/AirSync.app" output/

      - name: Upload AirSync.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-app
          path: output/AirSync.app
          if-no-files-found: error
          
